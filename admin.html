<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月相塔罗预约后台</title><style>body{margin:0;background:#10091c;color:#eee;font:14px system-ui;padding:30px}main{max-width:1100px;margin:auto}section{background:#1d132b;padding:22px;margin:18px 0;border:1px solid #51405e}input{display:block;margin:8px 0 16px;padding:12px;width:min(360px,90%);background:#10091c;color:white;border:1px solid #655477}button{padding:9px 14px;margin:3px;background:#d9b98c;border:0;cursor:pointer}button.cancel{background:transparent;color:#ffc5d1;border:1px solid #b36a7b}table{border-collapse:collapse;width:100%;min-width:850px}td,th{text-align:left;padding:10px;border-bottom:1px solid #493954;vertical-align:top}.scroll{overflow:auto}.muted{color:#b9a9c8}.hidden{display:none}</style><main><h1>月相塔罗 · 预约管理</h1><p class="muted">实时预约记录｜新预约自动显示</p><section id="login"><h3>管理员登录</h3><form id="loginForm">账号<input id="user" required>密码<input id="pass" type="password" required><button>登录</button></form><p id="msg"></p></section><section id="panel" class="hidden"><button id="refresh">刷新</button><button id="logout">退出</button><p id="count"></p><div class="scroll"><table><thead><tr><th>预约时间</th><th>客户</th><th>联系方式</th><th>方向</th><th>备注</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="config.js"></script><script>
let token=sessionStorage.getItem('adminToken')||'',es;const $=x=>document.getElementById(x);async function api(url,opt={}){let r=await fetch(window.apiUrl(url),{...opt,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...opt.headers}}),d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d;}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function load(){try{let d=await api('/api/admin/bookings');$('count').textContent='预约总数：'+d.bookings.length;$('rows').innerHTML=d.bookings.map(b=>`<tr><td>${esc(b.date)} ${esc(b.time)}</td><td>${esc(b.name)} (#${b.id})</td><td>${esc(b.contact)}</td><td>${esc(b.topic)}</td><td>${esc(b.question||'—')}</td><td>${({pending:'待确认',confirmed:'已确认',cancelled:'已取消'})[b.status]}</td><td>${b.status!=='confirmed'?`<button data-id="${b.id}" data-status="confirmed">确认</button>`:''}${b.status!=='cancelled'?`<button class="cancel" data-id="${b.id}" data-status="cancelled">取消</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7">暂无预约</td></tr>';}catch(e){$('msg').textContent=e.message;}}
function connect(){if(es)es.close();es=new EventSource(window.apiUrl('/api/events'));['booking-created','booking-updated'].forEach(e=>es.addEventListener(e,load));}function show(){ $('login').classList.add('hidden');$('panel').classList.remove('hidden');load();connect();}function logout(){if(es)es.close();token='';sessionStorage.removeItem('adminToken');$('panel').classList.add('hidden');$('login').classList.remove('hidden');}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{let d=await fetch(window.apiUrl('/api/admin/login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('user').value,password:$('pass').value})}).then(async r=>{let j=await r.json();if(!r.ok)throw Error(j.error);return j});token=d.token;sessionStorage.setItem('adminToken',token);show();}catch(e){$('msg').textContent=e.message;}};$('rows').onclick=async e=>{let b=e.target.closest('[data-id]');if(!b)return;try{await api('/api/admin/bookings/'+b.dataset.id,{method:'PATCH',body:JSON.stringify({status:b.dataset.status})});load();}catch(e){$('msg').textContent=e.message;}};$('refresh').onclick=load;$('logout').onclick=logout;if(token)show();
</script></main></html>
